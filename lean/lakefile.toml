name = "yapss"
defaultTargets = ["YAPSS"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0"

[[lean_lib]]
name = "YAPSS"
# 依存順（下位が先）。md/requirement.md §3.2 と同じ順序。
roots = [
  "Pss", "Term", "Decrease", "Reduction", "Cnf", "Seqlex", "Column",
  "Cofinality", "ArgDom", "Wset", "Final",
